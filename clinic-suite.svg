      <stop offset="0%" stop-color="#07182B"/><stop offset="100%" stop-color="#0E2842"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="16" fill="url(#galBg1)"/>
  
  <!-- Clinic Floor line -->
  <line x1="50" y1="460" x2="750" y2="460" stroke="#10BFC1" stroke-width="2" opacity="0.4"/>
  
