  <rect x="100" y="390" width="600" height="60" rx="12" fill="#07182B" stroke="#E6B84F" stroke-width="1.5"/>
  <text x="400" y="427" font-family="'Cairo', sans-serif" font-size="14" fill="#E2E8F0" font-weight="600" text-anchor="middle">
